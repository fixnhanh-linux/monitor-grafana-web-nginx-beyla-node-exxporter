scrape_configs:
  - job_name: "fpt-hn-beyla"
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets: ['103.237.145.7:9400']
        labels:
          env: 'production'
          site: 'fpt-hn'

  - job_name: "fpt-hcm-beyla"
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets: ['103.48.192.132:9400']
        labels:
          env: 'production'
          site: 'fpt-hcm'

  # Node Exporter 1.8.0 (cổng 9100): CPU / RAM / Disk / Network / TCP.
  # Cùng IP với Beyla ở trên để dashboard ghép đúng server; job_name phải chứa chữ "node".
  - job_name: "fpt-hn-node-exporter"
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets: ['103.237.145.7:9100']
        labels:
          env: 'production'
          site: 'fpt-hn'

  - job_name: "fpt-hcm-node-exporter"
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets: ['103.48.192.132:9100']
        labels:
          env: 'production'
          site: 'fpt-hcm'
