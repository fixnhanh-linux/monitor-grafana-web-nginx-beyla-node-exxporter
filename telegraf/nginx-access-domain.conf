# /etc/telegraf/telegraf.d/nginx-access-domain.conf
# Đọc access log nginx, đếm request và byte theo domain + mã trả về (resp_code).
# Xuất qua output prometheus_client sẵn có (cổng 9125) thành 2 counter:
#   nginx_domain_requests_total{domain, resp_code}
#   nginx_domain_bytes_total{domain, resp_code}
#
# Domain lấy theo thứ tự:
#   1. Tag "domain" nếu log có ghi $host (xem grok_patterns bên dưới)
#   2. Tên file log, ví dụ /var/log/nginx/longvan.net.access.log -> longvan.net
#
# Áp dụng: sudo usermod -aG adm telegraf && sudo systemctl restart telegraf
# Kiểm tra: curl -s localhost:9125/metrics | grep nginx_domain_

[[inputs.tail]]
  ## Sửa theo nơi nginx ghi log (mỗi domain một file là tốt nhất).
  ## Nginx chạy trong Docker: trỏ tới thư mục log đã mount ra host.
  files = ["/var/log/nginx/*access*.log"]
  from_beginning = false
  watch_method = "inotify"
  name_override = "nginx_access"
  data_format = "grok"
  ## Log dạng combined (có thể có thêm cột phía sau, ví dụ "$http_x_forwarded_for" $upstream_cache_status).
  grok_patterns = ['%{COMBINED_LOG_FORMAT}%{GREEDYDATA}']
  ## Nếu tất cả domain ghi chung một file: thêm ' host=$host' vào cuối log_format của nginx
  ## rồi đổi dòng trên thành:
  # grok_patterns = ['%{COMBINED_LOG_FORMAT}%{GREEDYDATA} host=%{NOTSPACE:domain:tag}']
  grok_timezone = "Local"
  fieldpass = ["resp_bytes"]
  taginclude = ["path", "resp_code", "domain"]

[[aggregators.starlark]]
  namepass = ["nginx_access"]
  period = "15s"
  grace = "1m"
  drop_original = true
  source = '''
SUFFIXES = [".log", "_access", ".access", "-access", "access"]

def domain_of(metric):
    d = metric.tags.get("domain")
    if d:
        return d
    name = metric.tags.get("path", "unknown").split("/")[-1]
    for s in SUFFIXES:
        if name.endswith(s) and len(name) > len(s):
            name = name[:-len(s)]
    return name or "unknown"

def add(metric):
    key = domain_of(metric) + "|" + metric.tags.get("resp_code", "000")
    s = state.get(key)
    if s == None:
        s = {"requests": 0, "bytes": 0}
    s["requests"] += 1
    s["bytes"] += metric.fields.get("resp_bytes", 0)
    state[key] = s

def push():
    out = []
    for key, s in state.items():
        domain, code = key.split("|")
        m = Metric("nginx_domain")
        m.tags["domain"] = domain
        m.tags["resp_code"] = code
        m.fields["requests_total"] = s["requests"]
        m.fields["bytes_total"] = s["bytes"]
        out.append(m)
    return out

def reset():
    # Giữ số cộng dồn (counter) để Prometheus dùng rate()
    pass
'''
