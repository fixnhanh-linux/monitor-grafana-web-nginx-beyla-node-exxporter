global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Tên job phải giữ là 'beyla-nginx' và 'node_exporter': dashboard lọc theo tên này.
  # Nếu Prometheus chạy cùng máy với Beyla, có thể thay IP bằng host.docker.internal.
  - job_name: 'beyla-nginx'
    static_configs:
      - targets: ['103.75.187.42:9090']
        labels:
          environment: 'production'
          domain: 'fixnhanh.cloud'

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['103.75.187.42:9100']
        labels:
          environment: 'production'
          domain: 'fixnhanh.cloud'
